name: Objavi dokumentaciju

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - mkdocs.yml
      - docs/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Preuzmi repozitorijum
        uses: actions/checkout@v4

      - name: Podesi Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instaliraj MkDocs
        run: python -m pip install mkdocs

      - name: Generiši sajt
        run: mkdocs build --strict

      - name: Podesi Pages
        uses: actions/configure-pages@v5

      - name: Otpremi Pages artefakt
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Objavi na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
